# EJBCA Community Edition for the CMP integration tests. make setup-ejbca starts and configures it.
# EJBCA_HTTP_PORT moves the CMP endpoint off port 8080 on the host.
name: certrally-ejbca

services:
  ejbca:
    image: keyfactor/ejbca-ce:9.6.3@sha256:ef574ed81c1e2bb335902f1097b09f9408fe32f2c3abbccfe80999d1c9b50164
    ports:
      - "127.0.0.1:${EJBCA_HTTP_PORT:-8080}:8080"
    environment:
      - TLS_SETUP_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/ejbca/publicweb/healthcheck/ejbcahealth"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
