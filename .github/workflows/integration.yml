# Runs certrally against independent CMP, EST and SCEP servers: the openssl cmp mock server, EJBCA
# Community Edition, the example server of Cisco libest and the SCEP server of micromdm/scep. A
# last job runs the SCEP commands against certrally scep mock.
name: Integration

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  schedule:
    # A weekly run catches changes of the runner image, such as a new Docker release.
    - cron: "29 5 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openssl:
    permissions:
      contents: read
    name: OpenSSL ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The tests run against fixed OpenSSL releases instead of the one the runner image ships: the
    # 3.5 LTS release, the oldest the tests support, and 4.0. Each build is cached.
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "3.5.9"
            sha256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
          - version: "4.0.3"
            sha256: 325b5c806167c13b40b1ffeadfe0248197c00eccc4cf123ec1e28d2d2fd216d9
    env:
      OPENSSL_VERSION: ${{ matrix.version }}
      OPENSSL_SHA256: ${{ matrix.sha256 }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/openssl
          key: ${{ runner.os }}-openssl-${{ env.OPENSSL_VERSION }}

      # The tarball is checked against the SHA-256 digest that openssl.org publishes for the release.
      - name: Build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl
          tarball="openssl-${OPENSSL_VERSION}.tar.gz"
          curl -fsSLo "$tarball" "https://www.openssl.org/source/${tarball}"
          echo "${OPENSSL_SHA256}  ${tarball}" | sha256sum -c -
          tar -xf "$tarball"
          cd "openssl-${OPENSSL_VERSION}"
          ./config --prefix=/opt/openssl --openssldir=/opt/openssl shared
          make -j"$(nproc)" > /dev/null
          sudo make install_sw > /dev/null

      - name: Put OpenSSL on the path
        run: |
          echo "/opt/openssl/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/openssl/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Run the OpenSSL tests
        run: make test-integration-openssl

  ejbca:
    permissions:
      contents: read
    name: EJBCA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Start and configure EJBCA
        run: make setup-ejbca

      - name: Run the EJBCA tests
        run: make test-integration-ejbca

      - name: Show the EJBCA log
        if: failure()
        run: docker compose -f test/integration/ejbca/docker-compose.yml logs --tail 300

      - name: Stop EJBCA
        if: always()
        run: make teardown-ejbca

  libest:
    permissions:
      contents: read
    name: Cisco libest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the libest server and run the EST tests
        run: make test-integration-libest

  micromdm:
    permissions:
      contents: read
    name: micromdm/scep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the micromdm/scep server and run the SCEP tests
        run: make test-integration-micromdm

  scep-mock:
    permissions:
      contents: read
    name: SCEP mock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run the SCEP tests against scep mock
        run: make test-integration-scep-mock

  # One check name to require in branch rules, whatever jobs the workflow has.
  gate:
    name: Integration gate
    if: always()
    needs: [openssl, ejbca, libest, micromdm, scep-mock]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every integration job
        env:
          OPENSSL: ${{ needs.openssl.result }}
          EJBCA: ${{ needs.ejbca.result }}
          LIBEST: ${{ needs.libest.result }}
          MICROMDM: ${{ needs.micromdm.result }}
          SCEP_MOCK: ${{ needs.scep-mock.result }}
        run: |
          echo "OpenSSL: ${OPENSSL}, EJBCA: ${EJBCA}, libest: ${LIBEST}, micromdm: ${MICROMDM}, scep mock: ${SCEP_MOCK}"
          test "$OPENSSL" = success && test "$EJBCA" = success && test "$LIBEST" = success &&
            test "$MICROMDM" = success && test "$SCEP_MOCK" = success
