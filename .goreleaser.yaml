# Release configuration for GoReleaser v2. The release workflow runs it on a stable version tag.
# `make release-snapshot` runs it locally without publishing.
version: 2

project_name: certrally

builds:
  - id: certrally
    main: ./cmd/certrally
    binary: certrally
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # certrally reads its version from the build information Go records from the Git checkout, so
    # the linker flags only strip debugging symbols.
    flags: [-trimpath]
    ldflags: [-s -w]
    # A fixed timestamp keeps the binaries reproducible from the tagged commit.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: certrally
    ids: [certrally]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - RELEASE_NOTES.md
      # The README links to these pages.
      - docs/*.md
    builds_info:
      mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive, written by syft.
sboms:
  - artifacts: archive

# Keyless cosign signature of the checksum file. It covers every archive listed in it.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

dockers_v2:
  - ids: [certrally]
    images: [ghcr.io/misiektoja/certrally]
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.source: https://github.com/misiektoja/certrally
      org.opencontainers.image.licenses: Apache-2.0
    annotations:
      "index,manifest:org.opencontainers.image.description": Command line client for certificate enrollment with CMP, EST and SCEP
      "index,manifest:org.opencontainers.image.source": https://github.com/misiektoja/certrally
      "index,manifest:org.opencontainers.image.licenses": Apache-2.0
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"

docker_digest:
  name_template: digests.txt

homebrew_casks:
  - name: certrally
    ids: [certrally]
    binaries: [certrally]
    homepage: https://github.com/misiektoja/certrally
    description: Command line client for certificate enrollment with CMP, EST and SCEP
    repository:
      owner: misiektoja
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    commit_msg_template: "feat: update {{ .ProjectName }} to {{ .Tag }}"
    # The cobra format adds the completion command and the shell name to the binary.
    generate_completions_from_executable:
      shell_parameter_format: cobra
    # The binaries are not notarized, so macOS kills a downloaded copy that still has the quarantine
    # attribute. Homebrew runs the binary for the completions before any postflight stanza, so the
    # attribute goes in a preflight step. GoReleaser v2.18 has no option for install steps. It applies
    # its templates to the custom block, so Homebrew's {{staged_path}} token is escaped.
    custom_block: |
      preflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/certrally"]
        end
      end

# The release workflow passes the RELEASE_NOTES.md section of the version with --release-notes.
# GoReleaser reads that file in its changelog step, so disabling the step leaves the release empty.
changelog:
  disable: false

# The release stays a draft until it is published by hand. A re-run of a failed release replaces the
# draft that the earlier run left.
release:
  github:
    owner: misiektoja
    name: certrally
  name_template: "{{ .Tag }}"
  draft: true
  replace_existing_draft: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
