version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - modernize
    - nakedret
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    staticcheck:
      checks:
        - "all"
        - "-QF*"
  exclusions:
    generated: lax
    rules:
      # Function declarations stay on one physical line.
      - linters:
          - lll
        source: '^func '
      # Test code closes bodies, ignores errors, repeats setup and repeats literals on purpose.
      - linters:
          - bodyclose
          - dupl
          - errcheck
          - goconst
          - gosec
          - lll
          - noctx
        path: _test\.go$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/misiektoja/certrally
